name: Deploy Wallets Hub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walletshub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Build production images
        run: |
          docker build --file src/WalletsHub.Api/Dockerfile --tag walletshub-api:latest .
          docker build --file frontend/wallets-hub-web/Dockerfile --build-arg API_INTERNAL_URL=http://walletshub-api:8080 --build-arg NEXT_PUBLIC_BASE_PATH=/wallets --tag walletshub-web:latest .
      - name: Package release
        run: |
          docker save walletshub-api:latest walletshub-web:latest | gzip -1 > /tmp/walletshub-images.tar.gz
          git archive --format=tar.gz --output=/tmp/walletshub-source.tar.gz HEAD
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/walletshub_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/walletshub_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          scp -i "$HOME/.ssh/walletshub_deploy" /tmp/walletshub-images.tar.gz /tmp/walletshub-source.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          scp -i "$HOME/.ssh/walletshub_deploy" ops/deploy-production.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/walletshub-deploy.sh"
          if test -n "$FIREBASE_SERVICE_ACCOUNT_BASE64"; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > /tmp/walletshub-firebase-service-account.json
            scp -i "$HOME/.ssh/walletshub_deploy" /tmp/walletshub-firebase-service-account.json "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          fi
      - name: Deploy isolated application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i "$HOME/.ssh/walletshub_deploy" "$DEPLOY_USER@$DEPLOY_HOST" 'bash /tmp/walletshub-deploy.sh'
