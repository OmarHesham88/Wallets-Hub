name: Deploy Wallets Hub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walletshub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Build production images
        run: |
          docker build --file src/WalletsHub.Api/Dockerfile --tag walletshub-api:latest .
          docker build --file frontend/wallets-hub-web/Dockerfile --build-arg API_INTERNAL_URL=http://walletshub-api:8080 --build-arg NEXT_PUBLIC_BASE_PATH=/wallets --tag walletshub-web:latest .
      - name: Package release
        run: |
          docker save walletshub-api:latest walletshub-web:latest | gzip -1 > /tmp/walletshub-images.tar.gz
          git archive --format=tar.gz --output=/tmp/walletshub-source.tar.gz HEAD
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/walletshub_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/walletshub_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: scp -i "$HOME/.ssh/walletshub_deploy" /tmp/walletshub-images.tar.gz /tmp/walletshub-source.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
      - name: Deploy isolated application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/walletshub_deploy" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -d "$HOME/walletshub"
          test -f "$HOME/walletshub/.env.production" || { echo "$HOME/walletshub/.env.production is required"; exit 1; }
          if test -f "$HOME/walletshub/docker-compose.production.yml"; then
            install -d -m 700 "$HOME/walletshub-backups"
            backup="$HOME/walletshub-backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            cd "$HOME/walletshub"
            docker compose --env-file .env.production -f docker-compose.production.yml exec -T walletshub-db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip -9 > "$backup"
            keys="${backup%.sql.gz}.keys.tar.gz"
            docker compose --env-file .env.production -f docker-compose.production.yml run -T --rm --no-deps walletshub-keys-init tar -czf - -C /keys . > "$keys"
            test -s "$backup"
            test -s "$keys"
            find "$HOME/walletshub-backups" -type f \( -name '*.sql.gz' -o -name '*.keys.tar.gz' \) -mtime +30 -delete
          fi
          find "$HOME/walletshub" -mindepth 1 -maxdepth 1 ! -name .env.production ! -name .initial-admin-password -exec rm -rf -- {} +
          tar -xzf /tmp/walletshub-source.tar.gz -C "$HOME/walletshub"
          gzip -dc /tmp/walletshub-images.tar.gz | docker load
          cd "$HOME/walletshub"
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --no-build --remove-orphans --force-recreate
          api_container="$(docker compose --env-file .env.production -f docker-compose.production.yml ps -q walletshub-api)"
          web_container="$(docker compose --env-file .env.production -f docker-compose.production.yml ps -q walletshub-web)"
          test -n "$api_container"
          test -n "$web_container"
          test "$(docker inspect --format '{{.Image}}' "$api_container")" = "$(docker image inspect --format '{{.Id}}' walletshub-api:latest)"
          test "$(docker inspect --format '{{.Image}}' "$web_container")" = "$(docker image inspect --format '{{.Id}}' walletshub-web:latest)"
          caddy_container="$(docker ps --filter label=com.docker.compose.service=caddy --format '{{.ID}}' | head -n 1)"
          test -n "$caddy_container"
          docker exec "$caddy_container" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error https://servicehub.ink/wallets/capture-health >/dev/null; then
              rm -f /tmp/walletshub-images.tar.gz /tmp/walletshub-source.tar.gz
              exit 0
            fi
            sleep 5
          done
          cd "$HOME/walletshub"
          docker compose --env-file .env.production -f docker-compose.production.yml ps
          exit 1
          REMOTE
