name: Backup Wallets Hub database

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/walletshub_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/walletshub_deploy" "$HOME/.ssh/known_hosts"
      - name: Create and verify server backup
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/walletshub_deploy" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/walletshub"
          test -f .env.production
          install -d -m 700 "$HOME/walletshub-backups"
          backup="$HOME/walletshub-backups/daily-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T walletshub-db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip -9 > "$backup"
          keys="${backup%.sql.gz}.keys.tar.gz"
          docker run --rm --volume walletshub_walletshub-keys:/keys:ro alpine:3.22 tar -czf - -C /keys . > "$keys"
          gzip -t "$backup"
          gzip -t "$keys"
          test "$(gzip -dc "$backup" | wc -c)" -gt 100
          test -s "$keys"
          find "$HOME/walletshub-backups" -type f \( -name '*.sql.gz' -o -name '*.keys.tar.gz' \) -mtime +30 -delete
          REMOTE
